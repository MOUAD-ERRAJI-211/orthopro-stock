<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - OrthoProConnect</title>
      <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <div class="auth-container">
        <!-- Header Section -->
        <div class="auth-header">
            <a href="../dashboard/dashboard.html" class="back-arrow">&larr;</a>
            <h1 class="brand-title">OrthoProConnect</h1>
            <p class="auth-subtitle">Student Authentication</p>
        </div>

        <!-- Content Section -->
        <div class="auth-content">
            <div class="auth-options">
                <!-- QR Scanner Section -->
                <div class="qr-scanner-section">
                    <button class="scan-btn" id="scan-btn">
                        <svg class="scan-icon" viewBox="0 0 24 24">
                            <path
                                d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v4h-4v2h6v-6zm-2-8h2v2h-2V5zM7 7h2v2H7V7zm12 12v2h-2v-2h2zm-6 0h2v2h-2v-2zm-6 0h2v2H7v-2zm-2-2h2v2H5v-2z" />
                        </svg>
                        Scan QR Code
                    </button>
                </div>

                <!-- Divider -->
                <div class="divider">OR</div>

                <!-- Code Input Section -->
                <div class="code-input-section">
                    <input type="text" class="student-code-input" id="student-code" placeholder="Enter Student Code"
                        autocomplete="off">
                    <button class="login-btn" id="login-btn">
                        <svg class="login-icon" viewBox="0 0 24 24">
                            <path
                                d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z" />
                        </svg>
                        Login
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="error-message"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../config/api-config.js"></script>
    <script src="../config/app-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="auth.js"></script>
</body>

</html>
