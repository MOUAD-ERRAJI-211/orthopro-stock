<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - OrthoProConnect</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <header class="header" id="header">
            <div class="header-content">
                <div class="brand-section">
                    <h1>OrthoProConnect</h1>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard" id="dashboard">
            <!-- Borrow Items Card -->
            <div class="card borrow-card" id="borrow-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Borrow Items</h2>
                    <p>Check out equipment and materials</p>
                </div>
            </div>

            <!-- Return Items Card -->
            <div class="card return-card" id="return-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" />
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Return Items</h2>
                    <p>Return borrowed equipment</p>
                </div>
            </div>

            <!-- Inventory Card -->
            <div class="card inventory-card hidden" id="inventory-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Inventory</h2>
                    <p>Manage stock and equipment</p>
                </div>
            </div>

            <!-- History Card -->
            <div class="card history-card hidden" id="history-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12.04H6c0-3.87 3.13-7 7-7s7 3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" />
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Student History</h2>
                    <p>View transaction history</p>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
