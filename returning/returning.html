<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Items - OrthoProConnect</title>
    <link rel="stylesheet" href="returning.css">
</head>

<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <h1 class="page-title">
                <svg class="title-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 7h-3V6a4 4 0 0 0-8 0v1H5a1 1 0 0 0-1 1v11a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V8a1 1 0 0 0-1-1zM10 6a2 2 0 0 1 4 0v1h-4V6zm8 13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9h2v1a1 1 0 0 0 2 0V9h4v1a1 1 0 0 0 2 0V9h2v10z" />
                </svg>
                Return Equipment
            </h1>
            <button class="back-btn" id="back-btn">
                <svg class="back-icon" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Back to Dashboard
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="return-container">
            <div class="section-header">
                <h2 class="section-title">
                    <svg class="section-icon" viewBox="0 0 24 24">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                    </svg>
                    Your Borrowed Items
                </h2>
                <p class="section-subtitle">Review and return your borrowed equipment</p>
            </div>

            <div class="items-list" id="return-items-container">
                <!-- Loading state -->
                <div class="loading" id="loading-state">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading your borrowed items...</p>
                </div>
            </div>
        </div>

        <!-- Empty state (hidden by default) -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <svg class="empty-icon" viewBox="0 0 24 24">
                <path
                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
            </svg>
            <h3 class="empty-title">No Items to Return</h3>
            <p class="empty-description">You don't have any items to return at the moment. Ready to borrow some
                equipment?</p>
            <button class="borrow-btn" id="borrow-btn">
                <svg class="borrow-icon" viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                Borrow Items
            </button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../config/api-config.js"></script>
    <script src="../config/app-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="returning.js"></script>
</body>

</html>
