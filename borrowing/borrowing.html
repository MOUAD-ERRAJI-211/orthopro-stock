<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Equipment - OrthoProConnect</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="borrowing.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="page-title">
                <svg class="title-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 7h-3V6a4 4 0 0 0-8 0v1H5a1 1 0 0 0-1 1v11a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V8a1 1 0 0 0-1-1zM10 6a2 2 0 0 1 4 0v1h-4V6zm8 13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9h2v1a1 1 0 0 0 2 0V9h4v1a1 1 0 0 0 2 0V9h2v10z" />
                </svg>
                Borrow Equipment
            </h1>
            <button class="back-btn" id="back-btn">
                <svg class="back-icon" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Back to Dashboard
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Action Bar -->
        <div class="action-bar">
            <div class="scan-section">
                <button class="scan-btn" id="scan-btn">
                    <svg class="scan-icon" viewBox="0 0 24 24">
                        <path
                            d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v4h-4v2h6v-6zm-2-8h2v2h-2V5zM7 7h2v2H7V7zm12 12v2h-2v-2h2zm-6 0h2v2h-2v-2zm-6 0h2v2H7v-2zm-2-2h2v2H5v-2z" />
                    </svg>
                    Scan QR Code
                </button>
                <p class="scan-instruction">Scan the QR code on equipment to borrow it quickly</p>
            </div>

            <div class="divider">OR</div>

            <div class="manual-input-section">
                <input type="text" class="manual-input" id="qr-input" placeholder="Enter QR code manually...">
                <button class="submit-btn" id="submit-btn">Submit</button>
            </div>
        </div>

        <!-- Selected Item Section -->
        <div class="selected-item-section" id="selected-item-section">
            <div class="selected-item-header">
                <h2 class="selected-item-title">
                    <i class="material-icons">check_circle</i>
                    Selected Item
                </h2>
                <button class="clear-selection-btn" id="clear-selection-btn">Clear Selection</button>
            </div>
            <div id="selected-item-content"></div>
        </div>

        <!-- Items Section -->
        <div class="items-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg style="width: 24px; height: 24px; fill: currentColor;" viewBox="0 0 24 24">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                    </svg>
                    Available Equipment
                </h2>
                <p class="section-subtitle" id="items-subtitle">Browse and select equipment to borrow</p>
            </div>
            <div class="items-grid" id="items-grid">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading available equipment...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- QR Scanner Modal -->
    <div class="qr-modal" id="qr-modal">
        <div class="qr-modal-content">
            <div class="qr-modal-header">
                <h2 class="qr-modal-title">Scan Equipment QR Code</h2>
                <button class="close-modal-btn" id="close-qr-modal">&times;</button>
            </div>
            <div class="qr-scanner-container">
                <div class="scanner-placeholder" id="scanner-placeholder"></div>
                <div class="scanner-overlay">
                    <div class="scanner-frame"></div>
                </div>
            </div>
            <div class="scanner-instructions">
                <p>Position the QR code within the frame to scan</p>
            </div>
        </div>
    </div>

    <!-- Borrow Modal -->
    <div class="borrow-modal" id="borrow-modal">
        <div class="borrow-modal-content">
            <div class="borrow-modal-header">
                <h2 class="borrow-modal-title">Borrow Equipment</h2>
                <button class="close-modal-btn" id="close-borrow-modal">&times;</button>
            </div>
            <div class="borrow-modal-body">
                <div class="modal-item-details" id="modal-item-details">
                    <!-- Item details will be populated here -->
                </div>

                <form class="borrow-form" id="borrow-form">
                    <div class="form-group">
                        <label class="form-label" for="quantity-input">Quantity</label>
                        <input type="number" class="form-input" id="quantity-input" min="1" value="1">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="return-date-input">Expected Return Date</label>
                        <input type="date" class="form-input" id="return-date-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="additional-students-input">Additional Students (comma
                            separated)</label>
                        <input type="text" class="form-input" id="additional-students-input"
                            placeholder="Enter student codes...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="notes-input">Notes</label>
                        <textarea class="form-input form-textarea" id="notes-input"
                            placeholder="Add any additional notes..."></textarea>
                    </div>

                    <button type="button" class="confirm-borrow-btn" id="confirm-borrow-btn">
                        Confirm Borrow
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../config/api-config.js"></script>
    <script src="../config/app-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="borrowing.js"></script>
</body>

</html>
